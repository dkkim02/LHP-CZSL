model:
  model_name: flow_composer
  prompt_template: ["a photo of x x", "a photo of x", "a photo of x"]
  ctx_init: ["a photo of ", "a photo of ", "a photo of "]
  clip_model: "ViT-L/14"
  clip_arch: "ViT-L/14"
  adapter_dim: 64
  adapter_dropout: 0.1
  cluster_num: 5
  proto_momentum: 0.99
  pair_loss_weight: 1.0
  pair_inference_weight: 1.0
  attr_loss_weight: 1.0
  attr_inference_weight: 1.0
  obj_loss_weight: 1.0
  obj_inference_weight: 1.0
  contrastive_weight: 0.1
  hsic_weight: 0.1
  # FlowComposer — template fallback
  lambda_flow: 1.0
  lambda_comp: 1.0
  lambda_leak: 0.5
  endpoint_tau: 0.07
  flow_step_h: 0.1
  flow_blend: 0.7
  flow_hidden_dim: 1024
  flow_num_blocks: 6
  composer_hidden_dim: 512
  llm_bank_K: 8
  llm_cache_path: data/llm_descriptions/mit-states/text_bank_K8_vitl14_qwen3b.pt
  llm_descriptions_root: cache/llm_descriptions/mit-states
  inference_mode: mean
  use_leakage: True

train:
  dataset: mit-states
  dataset_path: data/mit-states
  optimizer: Adam
  scheduler: StepLR
  step_size: 5
  gamma: 0.5
  lr: 0.0001
  attr_dropout: 0.3
  weight_decay: 0.00001
  context_length: 8
  train_batch_size: 4
  gradient_accumulation_steps: 16
  seed: 0
  epochs: 15
  epoch_start: 0
  save_path: checkpoint/flow_composer_l14_mit_llm_seed0
  save_every_n: 1
  val_metric: best_hm
  save_final_model: True

test:
  eval_batch_size: 16
  open_world: False
  topk: 1
  text_encoder_batch_size: 32
  threshold_trials: 50
  bias: 0.001
  text_first: True
