model:
  model_name: lhp_czsl
  prompt_template: ["a photo of x x", "a photo of x", "a photo of x"]
  ctx_init: ["a photo of ", "a photo of ", "a photo of "]
  clip_model: "ViT-B/16"
  clip_arch: "ViT-B/16"
  adapter_dim: 64
  adapter_dropout: 0.1
  cluster_num: 5
  cluster_min: 3
  # sub_meanings_path disabled (1-per-prim ckpt)
  text_ensemble: False
  proto_momentum: 0.99
  pair_loss_weight: 1.0
  pair_inference_weight: 1.0
  attr_loss_weight: 1.0
  attr_inference_weight: 1.0
  obj_loss_weight: 1.0
  obj_inference_weight: 1.0
  contrastive_weight: 0.1
  decorr_weight: 0.1
  sem_weight: 0.05

train:
  dataset: mit-states
  dataset_path: data/mit-states
  context_length: 8
  attr_dropout: 0.3
  seed: 0
  save_path: checkpoint/lhp_czsl_v2_b16_mit_8gpu

test:
  eval_batch_size: 32
  open_world: False
  topk: 1
  text_encoder_batch_size: 32
  threshold_trials: 50
  bias: 0.001
  text_first: False
